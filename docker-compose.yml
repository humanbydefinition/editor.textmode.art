# ============================================================================
# synth.textmode.art — Docker Compose for Coolify Deployment
# ============================================================================
#
# Services:
#   - app: Fastify server + built client static assets (synth.textmode.art)
#   - runner: Nginx serving the runner iframe build (runner.textmode.art)
#
# Coolify Setup:
#   1. Add this repository as a Docker Compose resource
#   2. Assign domains in the Coolify UI:
#      - app    → https://synth.textmode.art
#      - runner → https://runner.textmode.art
#   3. Set environment variables in Coolify's UI (see .env.example)
#
# ============================================================================

services:
  # ==========================================================================
  # App: Fastify API + Client Static Assets
  # ==========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - ANTI_SPAM_SECRET=${ANTI_SPAM_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - ANTI_SPAM_POW_DIFFICULTY=${ANTI_SPAM_POW_DIFFICULTY:-14}
      - ANTI_SPAM_CHALLENGE_TTL_SECONDS=${ANTI_SPAM_CHALLENGE_TTL_SECONDS:-180}
      - ANTI_SPAM_IDEMPOTENCY_TTL_SECONDS=${ANTI_SPAM_IDEMPOTENCY_TTL_SECONDS:-600}
      - ANTI_SPAM_MAX_CHALLENGES_PER_MINUTE=${ANTI_SPAM_MAX_CHALLENGES_PER_MINUTE:-600}
      - ANTI_SPAM_MAX_SUBMISSIONS_PER_MINUTE=${ANTI_SPAM_MAX_SUBMISSIONS_PER_MINUTE:-60}
      - ANTI_SPAM_MAX_PENDING_REQUESTS=${ANTI_SPAM_MAX_PENDING_REQUESTS:-5000}
      - SCREENSHOT_PREVIEW_TOKEN=${SCREENSHOT_PREVIEW_TOKEN}
      - SCREENSHOT_BASE_URL=${SCREENSHOT_BASE_URL:-}
      - SCREENSHOT_STORAGE_DIR=${SCREENSHOT_STORAGE_DIR:-}
      - STATIC_DIR=/app/dist
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://synth.textmode.art}
      - RUNNER_PUBLIC_URL=${RUNNER_PUBLIC_URL:-https://runner.textmode.art}
    expose:
      - "3000"
    volumes:
      - screenshot-storage:/app/server/storage
    restart: unless-stopped

volumes:
  screenshot-storage:
