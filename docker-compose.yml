# ============================================================================
# synth.textmode.art — Docker Compose for Coolify Deployment
# ============================================================================
#
# Services:
#   - client : Nginx serving the SPA + reverse proxy  (synth.textmode.art)
#   - server : Fastify API + SSR slug pages            (internal)
#   - runner : Nginx serving the runner iframe build   (runner.textmode.art)
#   - db     : PostgreSQL database                     (internal)
#
# Coolify Setup:
#   1. Add this repository as a Docker Compose resource
#   2. Assign domains in the Coolify UI:
#      - client → https://synth.textmode.art
#      - runner → https://runner.textmode.art
#   3. Set environment variables + build args in Coolify's UI (see .env.example)
#
# ============================================================================

services:
  # ==========================================================================
  # Client: Nginx — SPA static files + reverse proxy to server
  # ==========================================================================
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client
      args:
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
        - VITE_RUNNER_URL=${VITE_RUNNER_URL:-}
        - VITE_STRUDEL_RUNNER_URL=${VITE_STRUDEL_RUNNER_URL:-}
        - VITE_MEDIA_PROXY_URL=${VITE_MEDIA_PROXY_URL:-}
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
        - VITE_RUNNER_PARENT_ORIGINS=${VITE_RUNNER_PARENT_ORIGINS:-}
    expose:
      - "80"
    depends_on:
      - server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Server: Fastify — API, SSR slug pages, screenshots
  # ==========================================================================
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-synth}:${DB_PASSWORD}@db:5432/${DB_NAME:-synth_textmode}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN}
      - ANTI_SPAM_SECRET=${ANTI_SPAM_SECRET}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - ANTI_SPAM_POW_DIFFICULTY=${ANTI_SPAM_POW_DIFFICULTY:-14}
      - ANTI_SPAM_CHALLENGE_TTL_SECONDS=${ANTI_SPAM_CHALLENGE_TTL_SECONDS:-180}
      - ANTI_SPAM_IDEMPOTENCY_TTL_SECONDS=${ANTI_SPAM_IDEMPOTENCY_TTL_SECONDS:-600}
      - ANTI_SPAM_MAX_CHALLENGES_PER_MINUTE=${ANTI_SPAM_MAX_CHALLENGES_PER_MINUTE:-600}
      - ANTI_SPAM_MAX_SUBMISSIONS_PER_MINUTE=${ANTI_SPAM_MAX_SUBMISSIONS_PER_MINUTE:-60}
      - ANTI_SPAM_MAX_PENDING_REQUESTS=${ANTI_SPAM_MAX_PENDING_REQUESTS:-5000}
      - SCREENSHOT_PREVIEW_TOKEN=${SCREENSHOT_PREVIEW_TOKEN}
      - SCREENSHOT_BASE_URL=${SCREENSHOT_BASE_URL:-}
      - SCREENSHOT_STORAGE_DIR=/app/server/storage
      - STATIC_DIR=/app/dist
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://synth.textmode.art}
      - RUNNER_PUBLIC_URL=${RUNNER_PUBLIC_URL:-https://runner.textmode.art}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - screenshot-storage:/app/server/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ==========================================================================
  # Runner: Nginx — Sandboxed iframe on separate origin
  # ==========================================================================
  runner:
    build:
      context: .
      dockerfile: packages/runner/Dockerfile
      args:
        - VITE_RUNNER_PARENT_ORIGINS=${VITE_RUNNER_PARENT_ORIGINS:-https://synth.textmode.art}
        - VITE_MEDIA_PROXY_URL=${VITE_MEDIA_PROXY_URL:-}
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================================
  # Database: PostgreSQL
  # ==========================================================================
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-synth_textmode}
      POSTGRES_USER: ${DB_USER:-synth}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-synth} -d ${DB_NAME:-synth_textmode}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  screenshot-storage:
  pgdata:
