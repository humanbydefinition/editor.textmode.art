name: Deploy editor.textmode.art to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm

            - name: Report toolchain
              run: node --version && npm --version

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium
              run: npx playwright install chromium --with-deps --no-shell

            - name: Check
              run: npm run check
              env:
                  VITE_RUNNER_URL: https://runner.textmode.art/

            - name: Upload OG test artifacts
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: og-playwright-report
                  path: |
                      playwright-report/
                      test-results/og/
                  if-no-files-found: ignore

            - name: Create SPA fallback
              run: cp dist/index.html dist/404.html

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest

        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

    indexnow:
        needs: deploy
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc

            - name: Resolve IndexNow key from committed key file
              run: |
                  KEY_FILE=$(grep -lE '^[A-Za-z0-9-]{8,128}$' public/*.txt 2>/dev/null | head -n1)
                  if [ -z "$KEY_FILE" ]; then
                    echo "::error::No IndexNow key file found in public/"
                    exit 1
                  fi
                  echo "INDEXNOW_KEY=$(basename "$KEY_FILE" .txt)" >> "$GITHUB_ENV"

            - name: Submit sitemap to IndexNow
              env:
                  INDEXNOW_HOST: editor.textmode.art
              run: npx --yes "indexnow-submitter@^1.5.0" submit-sitemap https://editor.textmode.art/sitemap.xml
