name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # - name: Max lines guardrail
      #   run: npm run check:max-lines

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint

      # - name: Tests
      #  run: npm run test
