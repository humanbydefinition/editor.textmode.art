# ============================================================================
# synth.textmode.art — Production Nginx config for the client service
# ============================================================================
#
# Serves the built SPA and reverse-proxies API / SSR routes to the server.
# When the server is unavailable, slug pages gracefully fall back to the SPA
# so users always see the editor instead of an error page.
#
# ============================================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS — re-resolves on each request (handles container restarts)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Max request body (sketch submissions, etc.)
    client_max_body_size 5m;

    # -------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------
    add_header X-Content-Type-Options  "nosniff" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # -------------------------------------------------------------------
    # Compression
    # -------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript
        image/svg+xml;

    # -------------------------------------------------------------------
    # Vite-hashed static assets — aggressive long-term caching
    # -------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control        "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -------------------------------------------------------------------
    # API routes → server
    # -------------------------------------------------------------------
    location /api/ {
        set $backend http://server:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # -------------------------------------------------------------------
    # SSR slug pages → server (with graceful fallback when server is down)
    # -------------------------------------------------------------------
    location /s/ {
        set $backend http://server:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;

        # If the server is down, serve the SPA instead of a 502 error page.
        # The client-side ShareWorkflow detects the slug from the URL, tries
        # the API, and gracefully falls back to the default editor.
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa_fallback;
    }

    # -------------------------------------------------------------------
    # Screenshot storage → server
    # -------------------------------------------------------------------
    location /storage/ {
        set $backend http://server:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # -------------------------------------------------------------------
    # Internal screenshot preview routes → server
    # -------------------------------------------------------------------
    location /_internal/ {
        set $backend http://server:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # -------------------------------------------------------------------
    # SPA fallback — serves index.html for all client-side routes
    # (/, /nest, and any path not matched above)
    # -------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------
    # Named fallback: serves the SPA when the server is unavailable
    # -------------------------------------------------------------------
    location @spa_fallback {
        root /usr/share/nginx/html;
        try_files /index.html =502;
    }

    # Hide Nginx version
    server_tokens off;
}
